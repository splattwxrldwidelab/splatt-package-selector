<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPLATT WXRLDWIDE — Creator Packages</title>
<style>
:root{--pink:#ff2db2;--green:#39ff14;--blue:#4edcff;--bg:#050505}
*{box-sizing:border-box} body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:radial-gradient(circle at 20% 20%,rgba(255,45,178,.22),transparent 28%),radial-gradient(circle at 80% 15%,rgba(57,255,20,.16),transparent 28%),radial-gradient(circle at 90% 80%,rgba(78,220,255,.14),transparent 25%)}
.wrapper{width:min(1500px,100%);margin:auto;padding:18px 14px 50px}
.package-stage{position:relative;width:100%;line-height:0;isolation:isolate}
.package-art{display:block;width:100%;height:auto;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;top:3.20%;height:51.00%;border:2px solid transparent;border-radius:16px;background:transparent;cursor:pointer;transition:box-shadow .18s ease,background .18s ease,border-color .18s ease,filter .18s ease,transform .18s ease;z-index:3}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hotspot.entry{left:0.95%;width:21.55%;--accent:var(--pink)}
.hotspot.medium{left:23.70%;width:23.20%;--accent:var(--pink)}
.hotspot.creator{left:47.90%;width:24.45%;--accent:var(--green)}
.hotspot.diamond{left:73.85%;width:24.80%;--accent:var(--blue)}
.hotspot:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:0 0 16px var(--accent),0 0 42px color-mix(in srgb,var(--accent) 55%,transparent);filter:brightness(1.08)}
.hotspot.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:0 0 14px var(--accent),0 0 35px var(--accent),inset 0 0 28px color-mix(in srgb,var(--accent) 28%,transparent);filter:brightness(1.16)}
.hotspot.selected:after{content:"✓ SELECTED";position:absolute;left:50%;bottom:2%;transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:#050505;color:var(--accent);border:1px solid var(--accent);font:bold 12px/1 Arial;white-space:nowrap;box-shadow:0 0 16px var(--accent)}
.checkout{display:none;margin:20px auto 0;max-width:760px;padding:22px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(8,8,8,.94);text-align:center;box-shadow:0 0 30px rgba(255,45,178,.1)}
.checkout.visible{display:block}.checkout h2{margin:0 0 8px;font-size:clamp(20px,4vw,30px)} .checkout .chosen{color:#ddd;margin-bottom:18px}.payment-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pay{border:1px solid #555;border-radius:12px;background:#111;color:#fff;padding:14px 10px;font-weight:900;cursor:pointer;transition:.18s}.pay:hover{border-color:var(--green);box-shadow:0 0 16px rgba(57,255,20,.35)}.pay[disabled]{opacity:.45;cursor:not-allowed}.note{font-size:12px;color:#aaa;margin:14px 0 0;line-height:1.5}
@media(max-width:700px){.wrapper{padding:8px 4px 30px}.hotspot{top:3.20%;height:51.00%;border-radius:8px}.hotspot.selected:after{font-size:8px;padding:6px 7px}.payment-row{grid-template-columns:1fr}.checkout{margin:12px 6px 0}}

.overlay-control{position:absolute;z-index:8;font-family:Arial,Helvetica,sans-serif}
.addon-check{left:7.38%;top:62.15%;width:1.45%;height:2.45%;accent-color:var(--pink);cursor:pointer;margin:0}
.addon-code{left:23.70%;top:59.05%;width:11.95%;height:4.45%;border:1px solid transparent;border-radius:6px;background:rgba(0,0,0,.92);color:#fff;padding:0 8px;text-align:center;font-size:clamp(7px,.75vw,12px);outline:none}
.addon-code:focus{box-shadow:0 0 12px var(--pink);border-color:var(--pink)}
.overlay-btn{border:1px solid currentColor;border-radius:8px;background:rgba(0,0,0,.18);cursor:pointer;color:#fff;font-weight:900;transition:.18s;line-height:1}
.overlay-btn:hover,.overlay-btn:focus-visible{filter:brightness(1.25);box-shadow:0 0 18px currentColor;outline:none}
.unlock-btn{left:23.70%;top:65.05%;width:11.95%;height:4.55%;color:var(--pink);background:rgba(255,45,178,.06)}
.request-btn{left:56.35%;top:65.40%;width:9.30%;height:4.40%;color:var(--green);background:rgba(57,255,20,.06)}
.shop-btn{left:87.30%;top:65.35%;width:10.10%;height:4.45%;color:var(--pink);background:rgba(255,45,178,.06)}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.82)}.modal.open{display:grid}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#090909;border:1px solid var(--green);border-radius:18px;padding:22px;box-shadow:0 0 34px rgba(57,255,20,.25)}.modal-card h2{margin-top:0;color:var(--green)}.form-grid{display:grid;gap:12px}.form-grid input,.form-grid textarea,.form-grid select{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:9px;padding:12px}.form-grid textarea{min-height:120px;resize:vertical}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.modal-actions button{padding:11px 16px;border-radius:9px;border:1px solid #666;background:#151515;color:#fff;cursor:pointer}.modal-actions .primary{border-color:var(--green);color:var(--green)}
@media(max-width:700px){.addon-code{font-size:5px;padding:0 3px}.overlay-btn{font-size:0}.addon-check{min-width:10px;min-height:10px}}

.card-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.card-modal.open{display:flex}.card-box{width:min(460px,100%);background:#090b0b;border:2px solid #39ff88;border-radius:18px;padding:22px;box-shadow:0 0 30px rgba(57,255,136,.25)}.card-box h2{margin:0 0 8px}.card-box p{opacity:.8}.card-field{height:52px;background:white;border-radius:9px;margin:12px 0;overflow:hidden}.card-actions{display:flex;gap:10px;margin-top:14px}.card-actions button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:800;cursor:pointer}.card-actions .primary{background:#39ff88;color:#041108}.verified-link{display:inline-block;margin-top:14px;padding:14px 20px;border-radius:12px;background:#39ff88;color:#041108;text-decoration:none;font-weight:900}.pay:disabled{opacity:.48;cursor:not-allowed}
</style>
</head>
<body>
<main class="wrapper">
  <section class="package-stage" aria-label="SPLATT creator packages">
    <img class="package-art" src="assets/creator-packages.png" alt="SPLATT WXRLDWIDE Creator Packages">
    <button class="hotspot entry" data-name="Entry Level" data-price="150" aria-label="Select Entry Level package for 150 US dollars"></button>
    <button class="hotspot medium" data-name="Medium Influencer" data-price="180" aria-label="Select Medium Influencer package for 180 US dollars"></button>
    <button class="hotspot creator" data-name="Content Creator" data-price="220" aria-label="Select Content Creator package for 220 US dollars"></button>
    <button class="hotspot diamond" data-name="Diamond Package" data-price="310" aria-label="Select Diamond package for 310 US dollars"></button>

    <input class="overlay-control addon-check" id="addonCustomer" type="checkbox" aria-label="I am an existing SPLATT customer">
    <input class="overlay-control addon-code" id="addonCode" type="text" placeholder="ENTER CODE" aria-label="SPLATT customer code">
    <button class="overlay-control overlay-btn unlock-btn" id="unlockAddons" aria-label="Unlock add-ons"></button>
    <button class="overlay-control overlay-btn request-btn" id="customRequest" aria-label="Submit a custom request"></button>
    <button class="overlay-control overlay-btn shop-btn" id="shopAddons" aria-label="Shop add-ons"></button>
  </section>

  <section class="checkout" id="checkout" aria-live="polite">
    <h2 id="checkoutTitle">SELECT A PACKAGE</h2>
    <div class="chosen" id="chosen"></div>
    <div class="payment-row">
      <button class="pay" id="paypalBtn">PayPal</button>
      <button class="pay" id="cardBtn">Card</button>
      <button class="pay" id="appleBtn">Apple Pay</button>
    </div>
    <p class="note">Secure payment opens after package selection. The questionnaire should be shown only after a verified successful payment.</p>
  </section>
</main>
<div class="card-modal" id="cardModal" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card-box">
    <h2 id="cardTitle">SECURE CARD PAYMENT</h2>
    <p id="cardStatus">Enter your card details below. Card fields are securely hosted by PayPal.</p>
    <div class="card-field" id="paypal-card-fields-number"></div>
    <div class="card-field" id="paypal-card-fields-expiry"></div>
    <div class="card-field" id="paypal-card-fields-cvv"></div>
    <div class="card-actions"><button type="button" id="closeCard">Cancel</button><button class="primary" type="button" id="submitCard">Pay securely</button></div>
  </div>
</div>

<div class="modal" id="requestModal" role="dialog" aria-modal="true" aria-labelledby="requestTitle">
  <div class="modal-card">
    <h2 id="requestTitle">CUSTOM REQUEST ZONE</h2>
    <form class="form-grid" id="requestForm">
      <input name="name" required placeholder="Your name / creator name">
      <input name="email" type="email" required placeholder="Email address">
      <select name="type" required><option value="">What do you need?</option><option>Watermark</option><option>Emoji</option><option>GIF emote</option><option>Profile banner</option><option>Offline banner</option><option>Other custom design</option></select>
      <textarea name="details" required placeholder="Describe your idea, colours, style, platform and anything else we should know."></textarea>
      <input name="reference" placeholder="Optional reference link">
      <div class="modal-actions"><button type="button" id="closeRequest">Cancel</button><button class="primary" type="submit">Prepare Request</button></div>
    </form>
  </div>
</div>

<script async src="https://www.sandbox.paypal.com/web-sdk/v6/core" onload="onPayPalWebSdkLoaded()"></script>
<script>
const hotspots=[...document.querySelectorAll('.hotspot')];
const checkout=document.getElementById('checkout');
const checkoutTitle=document.getElementById('checkoutTitle');
const chosen=document.getElementById('chosen');
const paypalBtn=document.getElementById('paypalBtn');
const cardBtn=document.getElementById('cardBtn');
const appleBtn=document.getElementById('appleBtn');

const CREATE_ORDER_URL='https://ulsfycyfhxdkgatxqavh.supabase.co/functions/v1/quick-handler';
const CAPTURE_ORDER_URL='https://ulsfycyfhxdkgatxqavh.supabase.co/functions/v1/smart-function';
const CLIENT_TOKEN_URL='https://ulsfycyfhxdkgatxqavh.supabase.co/functions/v1/smart-handler';
const QUESTIONNAIRE_URL='https://docs.google.com/forms/d/e/1FAIpQLSd8ssAq_JoZcySZN1L4x1XO_-Oq-N8aNHSwJ14tY7odZrEcBw/viewform';
let cardSession=null;

const packageIds={
  '150':'entry',
  '180':'medium',
  '220':'creator',
  '310':'diamond'
};

let selected=null;

hotspots.forEach(zone=>zone.addEventListener('click',()=>{
  hotspots.forEach(x=>x.classList.remove('selected'));
  zone.classList.add('selected');
  selected={name:zone.dataset.name,price:zone.dataset.price,packageId:packageIds[zone.dataset.price]};
  checkoutTitle.textContent=`✓ ${selected.name.toUpperCase()} SELECTED — $${selected.price} USD`;
  chosen.textContent='Choose your secure payment method below.';
  checkout.classList.add('visible');
  checkout.scrollIntoView({behavior:'smooth',block:'nearest'});
}));

async function startPayPalCheckout(){
  if(!selected)return;
  paypalBtn.disabled=true;
  paypalBtn.textContent='Opening PayPal…';
  chosen.textContent='Creating your secure PayPal checkout…';
  try{
    const response=await fetch(CREATE_ORDER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({packageId:selected.packageId,paymentMethod:'paypal'})
    });
    const data=await response.json();
    if(!response.ok || !data.orderId || !data.approveLink){
      throw new Error(data.error || 'Unable to create PayPal checkout');
    }
    localStorage.setItem('splattPendingPayPal',JSON.stringify({
      orderId:data.orderId,
      packageId:selected.packageId,
      packageName:selected.name,
      amount:selected.price
    }));
    window.location.href=data.approveLink;
  }catch(error){
    console.error(error);
    chosen.textContent='PayPal checkout could not be opened. Please try again.';
    paypalBtn.disabled=false;
    paypalBtn.textContent='PayPal';
  }
}

paypalBtn.addEventListener('click',startPayPalCheckout);
const cardModal=document.getElementById('cardModal');
const cardStatus=document.getElementById('cardStatus');
const submitCard=document.getElementById('submitCard');
document.getElementById('closeCard').addEventListener('click',()=>cardModal.classList.remove('open'));

async function onPayPalWebSdkLoaded(){
  try{
    const r=await fetch(CLIENT_TOKEN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const t=await r.json();
    if(!r.ok || !t.clientToken) throw new Error(t.error||'Client token unavailable');
    const sdk=await window.paypal.createInstance({clientToken:t.clientToken,components:['card-fields']});
    const eligible=await sdk.findEligibleMethods({currencyCode:'USD'});
    if(eligible && typeof eligible.isEligible==='function' && !eligible.isEligible('advanced_cards')){
      cardBtn.disabled=true; cardBtn.title='Card checkout is not eligible for this PayPal account/session'; return;
    }
    cardSession=sdk.createCardFieldsOneTimePaymentSession();
    document.querySelector('#paypal-card-fields-number').appendChild(cardSession.createCardFieldsComponent({type:'number',placeholder:'Card number'}));
    document.querySelector('#paypal-card-fields-expiry').appendChild(cardSession.createCardFieldsComponent({type:'expiry',placeholder:'MM/YY'}));
    document.querySelector('#paypal-card-fields-cvv').appendChild(cardSession.createCardFieldsComponent({type:'cvv',placeholder:'CVV'}));
  }catch(e){console.error(e);cardBtn.disabled=true;cardBtn.title='Card checkout could not initialize';}
}

cardBtn.addEventListener('click',()=>{
  if(!selected)return;
  if(!cardSession){chosen.textContent='Secure card checkout is not available in this session.';return;}
  cardStatus.textContent=`${selected.name} — $${selected.price} USD`;
  cardModal.classList.add('open');
});

submitCard.addEventListener('click',async()=>{
  if(!selected||!cardSession)return;
  submitCard.disabled=true; cardStatus.textContent='Processing secure card payment…';
  try{
    const r=await fetch(CREATE_ORDER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packageId:selected.packageId,paymentMethod:'card'})});
    const order=await r.json();
    if(!r.ok||!order.orderId)throw new Error(order.error||'Unable to create order');
    const result=await cardSession.submit(order.orderId);
    if(result.state!=='succeeded')throw new Error(result.data?.message||`Card payment ${result.state||'failed'}`);
    const cr=await fetch(CAPTURE_ORDER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:order.orderId,packageId:selected.packageId})});
    const data=await cr.json();
    if(!cr.ok||data.success!==true||data.paymentVerified!==true)throw new Error(data.error||'Payment verification failed');
    cardModal.classList.remove('open');
    showVerifiedPayment(data,selected);
  }catch(e){console.error(e);cardStatus.textContent='Card payment did not complete. You have not been verified as paid. Please check the details or try another method.';}
  finally{submitCard.disabled=false;}
});

appleBtn.addEventListener('click',()=>{
  chosen.textContent='Apple Pay is not being offered in this checkout yet because PayPal Apple Pay eligibility depends on the merchant account country and customer device. Use PayPal or Card.';
});

function showVerifiedPayment(data,pending){
  localStorage.removeItem('splattPendingPayPal');
  checkout.classList.add('visible');
  checkoutTitle.textContent='✓ PAYMENT VERIFIED';
  chosen.innerHTML='';
  const msg=document.createElement('div');
  msg.textContent=`${data.packageName || pending.packageName} — $${data.amount || pending.amount} ${data.currency || 'USD'} successfully paid.`;
  const link=document.createElement('a');
  link.className='verified-link'; link.href=QUESTIONNAIRE_URL; link.target='_blank'; link.rel='noopener'; link.textContent='OPEN DESIGN QUESTIONNAIRE';
  chosen.append(msg,link);
  paypalBtn.style.display='none';cardBtn.style.display='none';appleBtn.style.display='none';
  history.replaceState({},document.title,window.location.pathname);
}

async function finishReturnedPayPalPayment(){
  const params=new URLSearchParams(window.location.search);
  const returnedToken=params.get('token');
  if(!returnedToken)return;

  let pending=null;
  try{ pending=JSON.parse(localStorage.getItem('splattPendingPayPal')||'null'); }catch(_e){}
  if(!pending || pending.orderId!==returnedToken || !pending.packageId){
    checkout.classList.add('visible');
    checkoutTitle.textContent='PAYPAL RETURN RECEIVED';
    chosen.textContent='We could not match this return to the checkout started on this device. Please contact SPLATT before retrying payment.';
    return;
  }

  checkout.classList.add('visible');
  checkoutTitle.textContent='VERIFYING PAYMENT…';
  chosen.textContent='Please keep this page open while PayPal confirms your payment.';
  paypalBtn.disabled=true; cardBtn.disabled=true; appleBtn.disabled=true;

  try{
    const response=await fetch(CAPTURE_ORDER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({orderId:pending.orderId,packageId:pending.packageId})
    });
    const data=await response.json();
    if(!response.ok || data.success!==true || data.paymentVerified!==true){
      throw new Error(data.error || 'Payment verification failed');
    }
    showVerifiedPayment(data,pending);
  }catch(error){
    console.error(error);
    checkoutTitle.textContent='PAYMENT VERIFICATION NEEDS ATTENTION';
    chosen.textContent='PayPal returned successfully, but automatic verification did not complete. Please do not pay again.';
  }
}

finishReturnedPayPalPayment();

const addonCustomer=document.getElementById('addonCustomer');
const addonCode=document.getElementById('addonCode');
document.getElementById('unlockAddons').addEventListener('click',()=>{
  if(!addonCustomer.checked){alert('Please confirm you are an existing SPLATT customer.');return;}
  if(!addonCode.value.trim()){addonCode.focus();alert('Enter your SPLATT customer code to unlock Add-On Mode.');return;}
  alert('Customer-code verification will activate once the secure customer database is connected. Your code has not been accepted or charged yet.');
});
const modal=document.getElementById('requestModal');
document.getElementById('customRequest').addEventListener('click',()=>modal.classList.add('open'));
document.getElementById('closeRequest').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.getElementById('requestForm').addEventListener('submit',e=>{e.preventDefault();alert('Your custom request form is ready. The next step is connecting its secure submission destination.');});
document.getElementById('shopAddons').addEventListener('click',()=>{
  if(!addonCustomer.checked || !addonCode.value.trim()){alert('Add-On Store is for existing SPLATT customers. Tick the customer box and enter your customer code first.');addonCode.focus();return;}
  alert('Add-On Store access will open here after customer-code verification is connected.');
});
</script>
</body>
</html>
